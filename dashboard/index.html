<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraPilot — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1923; color: #e0e0e0; }
        .header { background: #1a2d3d; padding: 20px 30px; border-bottom: 1px solid #2a3f50; }
        .header h1 { color: #00d4aa; font-size: 24px; }
        .header span { color: #8899aa; font-size: 14px; margin-left: 10px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1a2d3d; border-radius: 8px; padding: 20px; border: 1px solid #2a3f50; }
        .stat-card h3 { color: #8899aa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 28px; font-weight: bold; margin-top: 8px; }
        .stat-card .value.green { color: #00d4aa; }
        .stat-card .value.yellow { color: #ffc107; }
        .stat-card .value.red { color: #f44336; }
        .section { background: #1a2d3d; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a3f50; }
        .section h2 { color: #00d4aa; font-size: 16px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a3f50; font-size: 13px; }
        th { color: #8899aa; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge.active { background: #00d4aa22; color: #00d4aa; }
        .badge.warning { background: #ffc10722; color: #ffc107; }
        .badge.critical { background: #f4433622; color: #f44336; }
        .badge.info { background: #2196f322; color: #2196f3; }
        .progress-bar { height: 6px; border-radius: 3px; margin-top: 4px; background: #2a3f50; }
        .progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .progress-bar .fill.green { background: #00d4aa; }
        .progress-bar .fill.yellow { background: #ffc107; }
        .progress-bar .fill.red { background: #f44336; }
        .refresh-btn { background: #00d4aa; color: #0f1923; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; float: right; }
        .refresh-btn:hover { background: #00c49a; }
        .footer { text-align: center; padding: 20px; color: #556677; font-size: 12px; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>InfraPilot <span>Enterprise Infrastructure Monitoring</span></h1>
    </div>
    <div class="container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>Systems</h3><div class="value green" id="totalSystems">—</div></div>
            <div class="stat-card"><h3>Active</h3><div class="value green" id="activeSystems">—</div></div>
            <div class="stat-card"><h3>Alerts</h3><div class="value yellow" id="totalAlerts">—</div></div>
            <div class="stat-card"><h3>Critical</h3><div class="value red" id="criticalAlerts">—</div></div>
            <div class="stat-card"><h3>Avg CPU</h3><div class="value" id="avgCpu">—</div></div>
            <div class="stat-card"><h3>Avg Memory</h3><div class="value" id="avgMemory">—</div></div>
        </div>

        <div class="section">
            <h2>Systems <button class="refresh-btn" onclick="refresh()">⟳ Refresh</button></h2>
            <table>
                <thead><tr><th>Name</th><th>Status</th><th>CPU</th><th>Memory</th><th>Disk</th><th>Last Seen</th></tr></thead>
                <tbody id="systemsTable"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Recent Alerts</h2>
            <table>
                <thead><tr><th>Severity</th><th>System</th><th>Message</th><th>Time</th></tr></thead>
                <tbody id="alertsTable"></tbody>
            </table>
        </div>
    </div>
    <div class="footer">InfraPilot v1.0.0 — Built with Python, FastAPI &amp; ❤️</div>

    <script>
        async function refresh() {
            try {
                const [summ, systems, alerts] = await Promise.all([
                    fetch('/api/dashboard/summary').then(r => r.json()),
                    fetch('/api/systems', {headers: {'Authorization': 'Bearer admin'}}).then(r => r.json()).catch(() => []),
                    fetch('/api/alerts?limit=10', {headers: {'Authorization': 'Bearer admin'}}).then(r => r.json()).catch(() => []),
                ]);

                document.getElementById('totalSystems').textContent = summ.total_systems || 0;
                document.getElementById('activeSystems').textContent = summ.active_systems || 0;
                document.getElementById('totalAlerts').textContent = summ.total_alerts || 0;
                document.getElementById('criticalAlerts').textContent = summ.critical_alerts || 0;
                document.getElementById('avgCpu').textContent = (summ.avg_cpu || 0).toFixed(1) + '%';
                document.getElementById('avgMemory').textContent = (summ.avg_memory || 0).toFixed(1) + '%';

                const sysTbody = document.getElementById('systemsTable');
                sysTbody.innerHTML = '';
                if (Array.isArray(systems)) {
                    systems.forEach(s => {
                        const status = s.status === 'active' ? 'active' : 'warning';
                        sysTbody.innerHTML += `<tr>
                            <td>${s.name}</td>
                            <td><span class="badge ${status}">${s.status}</span></td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>${s.last_seen ? new Date(s.last_seen).toLocaleString() : 'never'}</td>
                        </tr>`;
                    });
                }
                if (sysTbody.innerHTML === '') {
                    sysTbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#556677;">No systems registered. Run an agent: <code>python agent/collector.py</code></td></tr>';
                }

                const alertTbody = document.getElementById('alertsTable');
                alertTbody.innerHTML = '';
                if (Array.isArray(alerts)) {
                    alerts.forEach(a => {
                        alertTbody.innerHTML += `<tr>
                            <td><span class="badge ${a.severity}">${a.severity}</span></td>
                            <td>${a.system_name || '—'}</td>
                            <td>${a.message}</td>
                            <td>${new Date(a.created_at).toLocaleString()}</td>
                        </tr>`;
                    });
                }
                if (alertTbody.innerHTML === '') {
                    alertTbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#556677;">No alerts. All systems healthy.</td></tr>';
                }
            } catch (e) {
                console.error('Refresh failed:', e);
            }
        }
        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
